[General]
network = DYMONetwork
sim-time-limit = 120s

# ============================================================
# LOGGING CONFIGURATION
# ============================================================
**.host*.networkLayer.routing.enableLogging = true

# ============================================================
# NETWORK CONFIGURATION
# ============================================================
**.numHosts = 50

# ============================================================
# NODE VISUALIZATION & DISPLAY STRINGS
# ============================================================
**.host*.displayString = "i=device/cellphone"

# Special startup node visual indicators
**.host[5].displayString = "i=device/cellphone,red"
**.host[30].displayString = "i=device/cellphone,blue"
**.host[40].displayString = "i=device/cellphone,green"

# ============================================================
# MOBILITY - RANDOM WAYPOINT (INET 3.4.0)
# ============================================================
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m

**.constraintAreaMaxX = 500m
**.constraintAreaMaxY = 500m
**.constraintAreaMaxZ = 0m

**.host*.mobilityType = "RandomWaypointMobility"
**.host*.mobility.initFromDisplayString = false
**.host*.mobility.speed = truncnormal(30mps, 10mps)
**.host*.mobility.waitTime = truncnormal(1s, 0.5s)
**.host*.mobility.updateInterval = 100ms
**.host*.mobility.initialX = uniform(0m, 500m)
**.host*.mobility.initialY = uniform(0m, 500m)
**.host*.mobility.initialZ = 0m

# ============================================================
# LAP-DSR PROTOCOL PARAMETERS
# ============================================================
# Enable Link Availability Prediction
**.host*.networkLayer.routing.useLinkAvailabilityPrediction = true

# LAP decision threshold
**.host*.networkLayer.routing.linkAvailabilityThreshold = 0.70

# HELLO packet interval
**.host*.networkLayer.routing.helloInterval = 1s

# Route cache lifetime
**.host*.networkLayer.routing.routeCacheTimeout = 600s

# Route discovery timeout
**.host*.networkLayer.routing.routeDiscoveryTimeout = 10s

# Maximum number of cached routes
**.host*.networkLayer.routing.maxRouteCacheSize = 50

# Maximum RREQ retry attempts
**.host*.networkLayer.routing.maxRouteRequestRetries = 3

# Node behavior defaults
**.host*.networkLayer.routing.isSelfish = false

# Test selfish node specification
**.host[23].networkLayer.routing.isSelfish = true

# ============================================================
# PHYSICAL LAYER (802.11 Radios)
# ============================================================
**.host*.wlan[0].radio.transmitter.power = 15dBm
**.host*.wlan[0].radio.receiver.sensitivity = -85dBm
**.host*.wlan[0].radio.carrierFrequency = 2.4GHz
**.host*.wlan[0].radio.transmitter.bitrate = 2Mbps

# ============================================================
# MAC LAYER (IEEE 802.11 MAC)
# ============================================================
**.host*.wlan[0].mac.typename = "Ieee80211Mac"
**.host*.wlan[0].mac.retryLimit = 7
**.host*.wlan[0].mac.cwMin = 31
**.host*.wlan[0].mac.cwMax = 1023

# ============================================================
# UDP APPLICATION TRAFFIC
#
# Source      : host[0]
# Destination : host[49]
# Packet      : 512 bytes
# Interval    : 1 ms
# ============================================================
**.host[0].numApps = 1
**.host[0].app[0].typename = "UdpBasicApp"
**.host[0].app[0].destAddresses = "host[49]"
**.host[0].app[0].destPort = 5000
**.host[0].app[0].messageLength = 512B
**.host[0].app[0].sendInterval = 1ms
**.host[0].app[0].startTime = 0s
**.host[0].app[0].stopTime = 110s

# UDP Sink Application
**.host[49].numApps = 1
**.host[49].app[0].typename = "UdpSink"

# ============================================================
# RESULT RECORDING & OUTPUTS
# ============================================================
record-eventlog = true
**.vector-recording = true
**.scalar-recording = true

output-vector-file = results/${configname}-${repetition}.vec
output-scalar-file = results/${configname}-${repetition}.sca

repeat = 1

# ============================================================
# BASE SCENARIO CONFIGURATION
# ============================================================

[Config LAPDSR_WithScenario]
description = "LAP-DSR Base Scenario"
network = DYMONetwork
sim-time-limit = 120s
#*.scenarioManager.script = xmldoc("scenario.xml")

[Config LAPDSR_Selfish_Base]
extends = LAPDSR_WithScenario
description = "LAP-DSR Selfish Node Test Base"
sim-time-limit = 60s
**.host*.mobility.speed = truncnormal(30mps, 10mps)
**.host*.mobility.waitTime = truncnormal(0.5s, 0.2s)
**.routing.isSelfish = false
**.host[23].routing.isSelfish = true

# ============================================================
# SELFISH NODE TEST CONFIGURATIONS FOR DIFFERENT MOBILITY INTERVALS
# ============================================================

[Config LAPDSR_Selfish_10ms]
extends = LAPDSR_Selfish_Base
description = "LAP-DSR Selfish Node Test with 10ms Mobility Update"
**.host*.mobility.updateInterval = 10ms

[Config LAPDSR_Selfish_20ms]
extends = LAPDSR_Selfish_Base
description = "LAP-DSR Selfish Node Test with 20ms Mobility Update"
**.host*.mobility.updateInterval = 20ms

[Config LAPDSR_Selfish_30ms]
extends = LAPDSR_Selfish_Base
description = "LAP-DSR Selfish Node Test with 30ms Mobility Update"
**.host*.mobility.updateInterval = 30ms

[Config LAPDSR_Selfish_50ms]
extends = LAPDSR_Selfish_Base
description = "LAP-DSR Selfish Node Test with 50ms Mobility Update"
**.host*.mobility.updateInterval = 50ms

[Config LAPDSR_Selfish_75ms]
extends = LAPDSR_Selfish_Base
description = "LAP-DSR Selfish Node Test with 75ms Mobility Update"
**.host*.mobility.updateInterval = 75ms

[Config LAPDSR_Selfish_100ms]
extends = LAPDSR_Selfish_Base
description = "LAP-DSR Selfish Node Test with 100ms Mobility Update"
**.host*.mobility.updateInterval = 100ms

# ============================================================
# ALL-IN-ONE BATCH SWEEP CONFIGURATION
# ============================================================

[Config LAPDSR_Selfish_Interval_Sweep]
extends = LAPDSR_Selfish_Base
description = "Run all mobility update interval tests automatically (10ms to 100ms)"
**.host*.mobility.updateInterval = ${interval = 10ms, 20ms, 30ms, 50ms, 75ms, 100ms}

# Dynamic Random Waypoint adjustments for scenario test
**.host*.mobility.speed = truncnormal(30mps, 10mps)
**.host*.mobility.waitTime = truncnormal(0.5s, 0.2s)

# Ensure selfish node parameter overrides inside sub-config
**.host*.networkLayer.routing.isSelfish = false
**.host[23].networkLayer.routing.isSelfish = true
